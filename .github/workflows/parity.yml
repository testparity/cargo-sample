name: Parity Sample

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  parity:
    name: Install and run Parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run sample tests
        run: cargo test --locked

      - name: Setup PHP for Parity
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, fileinfo, json

      - name: Install Parity
        run: |
          composer global require "testparity/parity:^1.2" --prefer-dist --no-progress --no-interaction
          composer global config bin-dir --absolute >> "$GITHUB_PATH"

      - name: Remove stale coverage evidence
        run: |
          rm -rf -- .parity
          test ! -e parity-coverage.json

      - name: Generate and check per-test coverage
        run: |
          set -o pipefail
          parity test --config=parity.yaml --format=json --show-tests | tee parity-result.json

      - name: Upload fresh Parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-per-test-evidence
          path: |
            .parity/per-test
            parity-result.json
          if-no-files-found: warn
          retention-days: 14
